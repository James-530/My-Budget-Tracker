<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - LAGO</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header>
    <div class="header-content">
      <button class="menu-button" id="menu-btn" aria-label="Open menu">☰</button>
      <h1 class="page-title">Categories</h1>
      <button class="header-action" id="add-category-btn">+ Add</button>
    </div>
  </header>
  <div id="sidebar-container"></div>
  <main>
    <section class="categories-tabs">
      <button class="tab-btn active" data-tab="income">Income Categories</button>
      <button class="tab-btn" data-tab="expense">Expense Categories</button>
    </section>
    <section class="categories-list">
      <div id="income-categories" class="tab-content active">
        <div class="category-grid" id="income-category-grid">
          <p class="empty-state">No income categories yet</p>
        </div>
      </div>
      <div id="expense-categories" class="tab-content">
        <div class="category-grid" id="expense-category-grid">
          <p class="empty-state">No expense categories yet</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Add/Edit Category Modal -->
  <div class="modal-overlay" id="category-modal-overlay"></div>
  <div class="modal" id="category-modal">
    <div class="modal-header">
      <h2 id="category-modal-title">Add Category</h2>
      <button class="modal-close" id="category-modal-close">&times;</button>
    </div>
    <form id="category-form">
      <input type="hidden" id="category-id">
      <input type="hidden" id="category-type">
      <div class="form-group">
        <label for="category-name">Name</label>
        <input type="text" id="category-name" placeholder="Enter category name" required>
      </div>
      <div class="form-group">
        <label for="category-icon">Icon</label>
        <select id="category-icon" required>
          <option value="💰">💰 Money</option>
          <option value="💵">💵 Salary</option>
          <option value="💼">💼 Business</option>
          <option value="🎁">🎁 Gift</option>
          <option value="🏠">🏠 Housing</option>
          <option value="🍔">🍔 Food</option>
          <option value="🚌">🚌 Transport</option>
          <option value="🛍️">🛍️ Shopping</option>
          <option value="🏥">🏥 Health</option>
          <option value="🎮">🎮 Entertainment</option>
          <option value="📚">📚 Education</option>
          <option value="⚡">⚡ Utilities</option>
          <option value="🚗">🚗 Vehicle</option>
          <option value="✈️">✈️ Travel</option>
          <option value="💄">💄 Personal</option>
          <option value="📦">📦 Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="category-color">Color</label>
        <input type="color" id="category-color" value="#FBBF24">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="category-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/categories.js"></script>
</body>
</html>
