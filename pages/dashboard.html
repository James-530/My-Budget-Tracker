<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LAGO</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header>
    <div class="header-content">
      <button class="menu-button" id="menu-btn" aria-label="Open menu">☰</button>
      <h1 class="page-title">Dashboard</h1>
    </div>
  </header>
  <div id="sidebar-container"></div>
  <main>
    <div class="dashboard-grid">
      <section class="stats-cards">
        <div class="stat-card income">
          <h3>Total Income</h3>
          <p class="stat-value" id="total-income">₱0.00</p>
        </div>
        <div class="stat-card expense">
          <h3>Total Expenses</h3>
          <p class="stat-value" id="total-expenses">₱0.00</p>
        </div>
        <div class="stat-card balance">
          <h3>Balance</h3>
          <p class="stat-value" id="balance">₱0.00</p>
        </div>
        <div class="stat-card savings">
          <h3>Savings Rate</h3>
          <p class="stat-value" id="savings-rate">0%</p>
        </div>
      </section>
      <section class="charts-section">
        <div class="chart-container">
          <h2>Expense Overview</h2>
          <canvas id="expense-chart"></canvas>
        </div>
        <div class="chart-container">
          <h2>Income vs Expenses</h2>
          <canvas id="income-expense-chart"></canvas>
        </div>
      </section>
      <section class="recent-transactions">
        <div class="section-header">
          <h2>Recent Transactions</h2>
          <a href="transactions.html" class="view-all">View All</a>
        </div>
        <div class="transaction-list" id="recent-transactions">
          <p class="empty-state">No transactions yet</p>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
