<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - LAGO</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header>
    <div class="header-content">
      <button class="menu-button" id="menu-btn" aria-label="Open menu"><i data-lucide="menu" style="width: 24px; height: 24px;"></i></button>
      <h1 class="page-title">Transactions</h1>
      <button class="header-action" id="add-transaction-btn">+ Add</button>
    </div>
  </header>
  <div id="sidebar-container"></div>
  <main>
    <section class="transactions-header">
      <div class="filter-group" id="filter-group">
        <select id="type-filter">
          <option value="all">All Types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <select id="category-filter">
          <option value="all">All Categories</option>
        </select>
        <input type="date" id="date-filter">
      </div>
    </section>
    <section class="transactions-list">
      <div class="table-container desktop-only">
        <table id="transactions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="transactions-body">
            <tr class="empty-row">
              <td colspan="6">No transactions found</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="mobile-only transaction-list" id="mobile-transactions-list">
        <!-- Will be populated via JS -->
      </div>
    </section>
  </main>

  <!-- Add/Edit Transaction Modal -->
  <div class="modal-overlay" id="transaction-modal-overlay"></div>
  <div class="modal" id="transaction-modal">
    <div class="modal-header">
      <h2 id="modal-title">Add Transaction</h2>
      <button class="modal-close" id="modal-close" aria-label="Close"><i data-lucide="x" style="width: 24px; height: 24px;"></i></button>
    </div>
    <form id="transaction-form">
      <input type="hidden" id="transaction-id">
      <div class="form-group">
        <label for="trans-type">Type</label>
        <select id="trans-type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="form-group">
        <label for="trans-category">Category</label>
        <select id="trans-category" required></select>
      </div>
      <div class="form-group">
        <label for="trans-description">Description</label>
        <input type="text" id="trans-description" placeholder="Enter description" required>
      </div>
      <div class="form-group">
        <label for="trans-amount">Amount (₱)</label>
        <input type="number" id="trans-amount" step="0.01" min="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label for="trans-date">Date</label>
        <input type="date" id="trans-date" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Transaction Details Modal -->
  <div class="modal-overlay" id="details-modal-overlay"></div>
  <div class="modal" id="details-modal">
    <div class="modal-header">
      <h2>Transaction Details</h2>
      <button class="modal-close" id="details-modal-close" aria-label="Close"><i data-lucide="x" style="width: 24px; height: 24px;"></i></button>
    </div>
    <div class="details-content">
      <div class="detail-item">
        <label>Date</label>
        <p id="detail-date"></p>
      </div>
      <div class="detail-item">
        <label>Category</label>
        <p id="detail-category"></p>
      </div>
      <div class="detail-item">
        <label>Description</label>
        <p id="detail-description" style="white-space: normal; overflow-wrap: anywhere;"></p>
      </div>
      <div class="detail-item">
        <label>Type</label>
        <p id="detail-type"></p>
      </div>
      <div class="detail-item">
        <label>Amount</label>
        <p id="detail-amount" class="stat-value" style="font-size: 20px;"></p>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="details-delete-btn">Delete Transaction</button>
      <button type="button" class="btn btn-primary" id="details-edit-btn">Edit Transaction</button>
      <button type="button" class="btn btn-secondary" id="details-close-btn">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/transactions.js"></script>
</body>
</html>
