<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - LAGO</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header>
    <div class="header-content">
      <button class="menu-button" id="menu-btn" aria-label="Open menu">☰</button>
      <h1 class="page-title">Reports</h1>
    </div>
  </header>
  <div id="sidebar-container"></div>
  <main>
    <section class="reports-controls">
      <div class="period-selector">
        <label for="report-period">Period</label>
        <select id="report-period">
          <option value="week">This Week</option>
          <option value="month" selected>This Month</option>
          <option value="quarter">This Quarter</option>
          <option value="year">This Year</option>
          <option value="custom">Custom Range</option>
        </select>
      </div>
      <div class="custom-date-range" id="custom-date-range" style="display: none;">
        <input type="date" id="start-date">
        <span>to</span>
        <input type="date" id="end-date">
      </div>
    </section>
    <section class="reports-summary">
      <div class="summary-grid" id="reports-summary-grid">
        <div class="summary-card">
          <h3>Total Income</h3>
          <p class="stat-value income" id="report-income">₱0.00</p>
        </div>
        <div class="summary-card">
          <h3>Total Expenses</h3>
          <p class="stat-value expense" id="report-expenses">₱0.00</p>
        </div>
        <div class="summary-card">
          <h3>Net Savings</h3>
          <p class="stat-value balance" id="report-savings">₱0.00</p>
        </div>
        <div class="summary-card">
          <h3>Savings Rate</h3>
          <p class="stat-value" id="report-savings-rate">0%</p>
        </div>
      </div>
    </section>
    <section class="reports-charts">
      <div class="chart-container">
        <h2>Expenses by Category</h2>
        <canvas id="category-chart"></canvas>
      </div>
      <div class="chart-container">
        <h2>Income vs Expenses Trend</h2>
        <canvas id="trend-chart"></canvas>
      </div>
    </section>
    <section class="reports-breakdown">
      <h2>Category Breakdown</h2>
      <div class="table-container">
        <table id="category-breakdown-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Amount</th>
              <th>Percentage</th>
              <th>Transactions</th>
            </tr>
          </thead>
          <tbody id="category-breakdown-body">
            <tr class="empty-row">
              <td colspan="4">No data available</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
